<app-hero />

<section class="fixed-width">
  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" [animationDuration]="0">
    <mat-tab label="About me">
      <app-about />
    </mat-tab>

    <mat-tab label="Portfolio">
      @for (cat of computedCategories(); track $index) {
        @for (item of cat.items; track $index) {
          <app-portfolio-item [portfollioItem]="item" />
        }
      }
    </mat-tab>
  </mat-tab-group>
</section>
